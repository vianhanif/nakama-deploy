name: build-test

# Builds the image from our fork with Buildx, pushes a TEST tag to GHCR only,
# then boot-checks the container on the runner. No deploy, no production tags.
# Mirrors 9router-deploy/.github/workflows/build-test.yml.

on:
  workflow_dispatch:
    inputs:
      nakama_branch:
        description: "Fork branch or SHA"
        default: main
        required: false
  push:
    paths:
      - 'src/**'
      - '.github/workflows/build-test.yml'

concurrency:
  group: build-test
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nakama-deploy/nakama

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image from fork
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/nakama/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          build-args: |
            NAKAMA_VERSION=${{ inputs.nakama_branch || 'main' }}
          tags: |
            ${{ env.IMAGE }}:test-ghcr-${{ github.sha }}
            ${{ env.IMAGE }}:test-ghcr
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot-check
        run: |
          set -euo pipefail
          docker run -d --name smoke \
            -e NAKAMA_SECRETS_KEY="$(openssl rand -base64 32)" \
            -p 4310:4310 "${{ env.IMAGE }}:test-ghcr-${{ github.sha }}"
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:4310/health; then
              echo "health OK after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "health check timed out"
          docker logs smoke | tail -50
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker logs smoke 2>&1 | tail -100 || true
